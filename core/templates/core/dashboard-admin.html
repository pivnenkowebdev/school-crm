<!DOCTYPE html>
<html>
<head>
    <title>Админ</title>
</head>
<body>

<h1>Админ</h1>

<h2>Создать сообщение</h2>

<form method="post">
    {% csrf_token %}

    <input type="text" name="title" placeholder="Заголовок" required>
    <br><br>

    <textarea name="text" placeholder="Текст сообщения" required></textarea>
    <br><br>

    <label>Класс:</label>
    <select name="school_class">
        <option value="">Для всех</option>
        {% for cls in classes %}
            <option value="{{ cls.id }}">{{ cls.name }}</option>
        {% endfor %}
    </select>
    <br><br>

    <button type="submit">Отправить</button>
</form>

<hr>

<h2>Все сообщения</h2>

{% for message in messages %}
    <h3>{{ message.title }}</h3>
    <p>{{ message.text }}</p>
    <p>
        Класс:
        {% if message.school_class %}
            {{ message.school_class.name }}
        {% else %}
            Для всех
        {% endif %}
    </p>
    <hr>
{% endfor %}

<form method="post" action="{% url 'logout' %}">
    {% csrf_token %}
    <button type="submit">Выйти</button>
</form>

</body>
</html>
